[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"

[project]
name="mitros"
version="0.1.0"
requires-python=">=3.12"
dependencies=["pydantic>=2.8,<3","pydantic-settings>=2.4,<3","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","alembic>=1.13,<2","httpx>=0.27,<1","tenacity>=9,<10","structlog>=24,<26"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","pytest-asyncio>=0.24,<1","mypy>=1.11,<2","ruff>=0.6,<1","jsonschema>=4.23,<5"]
[tool.setuptools.packages.find]
include=["contracts*","packages*"]
[tool.ruff]
line-length=100
target-version="py312"
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.mypy]
python_version="3.12"
strict=true
[tool.ruff.lint]
ignore=["BLE001","FURB157","I001","UP017"]
