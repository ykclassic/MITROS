name: MITROS CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy contracts packages
      - run: pytest
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s supabase/migrations/0001_mitros_foundation.sql
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked credential material
        run: |
          if grep -RInE '(^|[ =])(sk-[A-Za-z0-9]|ghp_[A-Za-z0-9]|xox[baprs]-[A-Za-z0-9]|AKIA[0-9A-Z]{16})' --exclude-dir=.git .; then
            echo "Potential credential material found in tracked repository content"
            exit 1
          fi
      - name: Require deployment contract files
        run: |
          test -s .env.example
          test -s docs/architecture/deployment-configuration.md
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require phase branch for PRs to main
        if: github.event_name == 'pull_request'
        run: |
          case "$GITHUB_HEAD_REF" in
            phase/*) ;;
            *) echo "PR must originate from phase/*"; exit 1;;
          esac
