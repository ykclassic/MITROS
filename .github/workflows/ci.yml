name: MITROS CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy contracts packages
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
  deployment-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8.3,<9"
      - name: Run production deployment verification
        env:
          MITROS_PRODUCTION_API_URL: https://mitros.onrender.com
          MITROS_PRODUCTION_WEB_URL: https://mitros.vercel.app
          MITROS_PRODUCTION_VERCEL_ORIGIN: https://mitros.vercel.app
          MITROS_RUN_DEPLOYMENT_E2E: "true"
        run: python -m pytest -q tests/deployment/test_production_deployment.py
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s supabase/migrations/0001_mitros_foundation.sql
      - run: test -s supabase/migrations/0002_execution_ledger.sql
      - run: test -s supabase/migrations/0003_auth_identity.sql
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked credential material
        run: |
          if grep -RInE '(^|[ =])(sk-[A-Za-z0-9]|ghp_[A-Za-z0-9]|xox[baprs]-[A-Za-z0-9]|AKIA[0-9A-Z]{16})' --exclude-dir=.git .; then
            echo "Potential credential material found in tracked repository content"
            exit 1
          fi
      - name: Reject provider secrets from client code
        run: |
          if grep -RInE 'MITROS_MARKET_(TWELVEDATA|FINNHUB|ALPHAVANTAGE)_API_KEY' apps/web --exclude-dir=node_modules --exclude-dir=.next; then
            echo "Provider credentials must remain server-side"
            exit 1
          fi
      - name: Require deployment contract files
        run: |
          test -s .env.example
          test -s docs/architecture/deployment-configuration.md
          test -s docs/architecture/deployment-verification.md
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require phase branch for PRs to main
        if: github.event_name == 'pull_request'
        run: |
          case "$GITHUB_HEAD_REF" in
            phase/*) ;;
            *) echo "PR must originate from phase/*"; exit 1;;
          esac
