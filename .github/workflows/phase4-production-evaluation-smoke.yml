name: Phase 4 Production Evaluation Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: "Exact deployed SHA; defaults to the main commit at dispatch time"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mitros-phase4-production-evaluation-smoke
  cancel-in-progress: false

jobs:
  phase4-evaluation-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Authenticated Phase 4 Evaluation and Persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-verification
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_commit_sha || github.sha }}
    steps:
      - name: Validate candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_commit_sha must be a full 40-character commit SHA."
            exit 1
          fi

      - name: Check out the exact deployed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${CANDIDATE_SHA,,}" ]]; then
            echo "::error::Checked-out commit does not match candidate_commit_sha."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Send one authenticated evaluation and verify persisted rows
        env:
          MITROS_E2E_SUPABASE_URL: ${{ secrets.MITROS_E2E_SUPABASE_URL }}
          MITROS_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MITROS_E2E_SUPABASE_PUBLISHABLE_KEY }}
          MITROS_E2E_USER_EMAIL: ${{ secrets.MITROS_E2E_USER_EMAIL }}
          MITROS_E2E_USER_PASSWORD: ${{ secrets.MITROS_E2E_USER_PASSWORD }}
          MITROS_DATABASE_URL: ${{ secrets.MITROS_DATABASE_URL }}
          MITROS_BACKEND_URL: ${{ vars.MITROS_BACKEND_URL }}
          MITROS_EXPECTED_DB_NAME: ${{ vars.MITROS_EXPECTED_DB_NAME }}
          MITROS_EXPECTED_DEPLOYED_SHA: ${{ inputs.candidate_commit_sha || github.sha }}
        run: python scripts/run_phase4_smoke.py
