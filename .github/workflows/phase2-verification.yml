name: MITROS Phase 2 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "packages/intelligence/**"
      - "packages/features/**"
      - "packages/market_data/**"
      - "tests/unit/test_market_intelligence_phase2.py"
      - "tests/unit/test_provider_replacement.py"
      - "tests/integration/test_provider_replacement_integration.py"
      - ".github/workflows/phase2-verification.yml"
  push:
    branches: [main, "phase/**"]
    paths:
      - "contracts/**"
      - "packages/intelligence/**"
      - "packages/features/**"
      - "packages/market_data/**"
      - "tests/unit/test_market_intelligence_phase2.py"
      - ".github/workflows/phase2-verification.yml"

jobs:
  production-matrix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8.3,<9"
      - name: Verify production BTC/ETH market data + intelligence matrix
        env:
          MITROS_PRODUCTION_API_URL: https://mitros.onrender.com
          MITROS_PRODUCTION_WEB_URL: https://mitros.vercel.app
          MITROS_PRODUCTION_VERCEL_ORIGIN: https://mitros.vercel.app
          MITROS_PRODUCTION_ACCESS_TOKEN: ${{ secrets.MITROS_PRODUCTION_ACCESS_TOKEN }}
          MITROS_RUN_DEPLOYMENT_E2E: "true"
        run: python -m pytest -q tests/deployment/test_production_deployment.py -k authenticated_production_market_data_and_intelligence_matrix

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check contracts packages tests/unit/test_market_intelligence_phase2.py
      - run: mypy contracts packages
      - run: pytest -q tests/unit/test_market_intelligence_phase2.py tests/unit/test_regime_statistics.py tests/unit/test_crt_strategy.py tests/unit/test_smc_strategy.py tests/unit/test_provider_replacement.py tests/integration/test_provider_replacement_integration.py
