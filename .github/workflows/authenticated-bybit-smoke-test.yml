name: Authenticated Bybit Read-Only Smoke Test

on:
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: "Exact current head SHA of PR #74 to verify"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mitros-bybit-readonly-verification
  cancel-in-progress: false

jobs:
  bybit-smoke-verification:
    name: Protected Bybit Read-Only Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-verification
    steps:
      - name: Validate exact PR #74 candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Candidate must be a full 40-character commit SHA."
            exit 1
          fi
          pr_json="$(gh api repos/ykclassic/MITROS/pulls/74)"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_merged="$(jq -r '.merged' <<<"$pr_json")"
          pr_branch="$(jq -r '.head.ref' <<<"$pr_json")"
          pr_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [[ "$pr_state" != "open" || "$pr_merged" != "false" ]]; then
            echo "::error::PR #74 must remain open and unmerged."
            exit 1
          fi
          if [[ "$pr_branch" != "phase/phase4-bybit-reconciled" || "$pr_repo" != "ykclassic/MITROS" ]]; then
            echo "::error::PR #74 does not point to the authorized candidate branch."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA,,}" != "${pr_sha,,}" ]]; then
            echo "::error::Candidate SHA does not match the current PR #74 head."
            exit 1
          fi
          echo "Candidate SHA verified against the current unmerged PR #74 head."

      - name: Check out validated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${CANDIDATE_SHA,,}" ]]; then
            echo "::error::Checked-out commit does not match the requested candidate."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate credential presence without disclosure
        env:
          MITROS_BYBIT_API_KEY: ${{ secrets.MITROS_BYBIT_API_KEY }}
          MITROS_BYBIT_API_SECRET: ${{ secrets.MITROS_BYBIT_API_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          key = os.getenv("MITROS_BYBIT_API_KEY", "").strip()
          secret = os.getenv("MITROS_BYBIT_API_SECRET", "").strip()
          if not key or not secret:
              print("::error::Required Bybit credentials are not configured in the protected environment.")
              sys.exit(1)
          print("Bybit credential presence check passed; values and lengths were not logged.")
          PY

      - name: Run authenticated read-only verification
        env:
          MITROS_BYBIT_API_KEY: ${{ secrets.MITROS_BYBIT_API_KEY }}
          MITROS_BYBIT_API_SECRET: ${{ secrets.MITROS_BYBIT_API_SECRET }}
          MITROS_BYBIT_BASE_URL: ${{ vars.MITROS_BYBIT_BASE_URL }}
          MITROS_BYBIT_MAX_TICKER_AGE_SECONDS: "60"
          MITROS_XT_LIVE_ORDERS_ENABLED: "false"
        run: python scripts/verify_bybit_readonly.py
