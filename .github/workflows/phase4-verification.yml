name: MITROS Phase 4 Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase/**"]

jobs:
  phase4-risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Verify Phase 4 risk engine, proposal builder, and API safety guards
        run: pytest tests/unit/test_phase4_risk.py tests/unit/test_phase4_proposal_builder.py tests/unit/test_phase4_api_guard.py tests/unit/test_xt_account.py tests/unit/test_xt_execution.py tests/unit/test_execution_gateway.py
      - name: Require durable risk audit schema
        run: test -s supabase/migrations/20261010174746_0010_phase4_risk_decision_audit.sql
      - name: Require documented live-mode fail-closed boundary
        run: grep -q "build_account_client" packages/api/app.py
      - run: grep -q "MITROS_XT_LIVE_ORDERS_ENABLED" packages/execution/xt.py
